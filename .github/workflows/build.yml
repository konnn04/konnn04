name: Build

on:
  push:
    branches: [ main-2rd ]
  schedule:
    - cron: '0/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Add timeout to prevent hanging
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main-2rd
      
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      
      - name: Move files to root directory
        run: |
          cp dist/github-contribution-grid-snake.svg github-snake.svg
          cp dist/github-contribution-grid-snake-dark.svg github-snake-dark.svg
      
      - name: Commit snake animation to main-2rd
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-snake.svg github-snake-dark.svg
          git commit -m 'Update snake animation' || true
          git push origin main-2rd

  # Keep the original target too for backward compatibility
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Add timeout to prevent hanging

    steps:
    - uses: actions/checkout@v4
      with:
        ref: main-2rd
        
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        architecture: 'x64'
        cache: 'pip'

    - name: Install requirements
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install -r requirements.txt

    - name: Generate images
      run: |
        echo "Starting stats generation..."
        git pull
        python3 generate_images.py
        echo "Stats generation complete!"
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.repository_owner }}  # Add this line
        EXCLUDE_FORKED_REPOS: true

    - name: Commit stats images
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add generated/
        git commit -m 'Update stats images' || true
        git push origin main-2rd